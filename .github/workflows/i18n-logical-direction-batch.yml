name: Generate logical-direction patch
on:
  pull_request:
    paths: ["i18n/direction.config.json", "scripts/i18n-logical-direction-batch.mjs", ".github/workflows/i18n-logical-direction-batch.yml"]
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: yarn }
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: node scripts/i18n-logical-direction-batch.mjs
      - run: |
          git diff --check
          git diff -- app components i18n > i18n-logical-direction.patch
          test -s i18n-logical-direction.patch
      - uses: actions/upload-artifact@v4
        with: { name: i18n-logical-direction-patch, path: i18n-logical-direction.patch }
