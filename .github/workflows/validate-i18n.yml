name: Validate en/ar web contract

on:
  pull_request:
    paths: ["app/**", "components/**", "i18n/**", "middleware.ts", "DOCS.md", ".github/workflows/validate-i18n.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: arc-runner-set
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: yarn }
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - name: Build production English gate
        run: yarn build
      - name: Build review-only Arabic fallback
        run: I18N_ARABIC_REVIEW_MODE=true yarn build
      - name: Install browser verifier
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
      - name: Verify desktop and mobile RTL
        env:
          I18N_ARABIC_REVIEW_MODE: "true"
          VISUAL_PATH: "/"
        run: |
          yarn start --port 4173 > /tmp/quikdb-demo-i18n.log 2>&1 &
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node scripts/i18n-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i18n-rtl-screenshots
          path: artifacts/i18n
